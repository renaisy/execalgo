[project]
name = "execalgo"
version = "2.4.0"
description = "Optimal execution algorithms (IS / VWAP benchmarks) via perturbation theory for nonlinear transient impact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
